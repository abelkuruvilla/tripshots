name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: install
        run: pip install -e ".[dev,export,watch]"
      - name: quick tests
        run: pytest -q -m "not slow"
      - name: end-to-end reel
        run: pytest -q -m slow
      - name: generated docs are up to date
        if: matrix.python == '3.13'  # argparse help text differs between Python versions
        run: python tools/gen_docs.py --check

  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: UI builds
        working-directory: desktop
        run: npm ci && npm run build
      - name: shell compiles and its tests pass
        working-directory: desktop/src-tauri
        run: cargo test --locked

