name: release

# One tag does the whole release. Either push a tag (git tag v0.1.0 && git push origin v0.1.0, or create it on
# GitHub with "Draft a new release"), or run this workflow from the Actions tab and type the version. The version
# comes from the tag and is written into the engine and the app inside CI: nothing to bump or commit beforehand.
# It builds the engine and the desktop app for macOS (Apple Silicon), Windows and Linux, signs them, and
# publishes one GitHub release with:
#   tripshots-engine-<v>-<platform>.tar.gz|zip (+ .sig)   the engine the app downloads on first run / updates
#   engine.json                                          the manifest the app reads (releases/latest/download/)
#   TripShots_<v>_*.dmg / .msi / .exe / .deb / .rpm / .AppImage, latest.json (the app's own updates)
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY (contents of ~/.tauri/tripshots.key), TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
# Optional, macOS app signing + notarisation: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID.
# Optional, Windows code signing: see desktop/README.md.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version to release, e.g. 0.1.0 (tags the selected branch as v0.1.0, or rebuilds that tag)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release_id: ${{ steps.rel.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: the version is the tag
        run: |
          V="${TAG#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::tag $TAG isn't vMAJOR.MINOR.PATCH"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: signing key is set up
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::add the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets (desktop/README.md)"; exit 1; }
      - name: tag (when started from the Actions tab)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$TAG" -f sha="${{ github.sha }}"
          fi
      - id: rel
        name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "TripShots $TAG" --generate-notes
          fi
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  engine:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # (no Intel Mac engine: numba/llvmlite and onnxruntime no longer publish Intel Mac builds)
          - { os: macos-15, platform: darwin-aarch64 }
          - { os: ubuntu-22.04, platform: linux-x86_64 }
          - { os: windows-latest, platform: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: stamp the version (and the telemetry collector, when the repository variable TELEMETRY_URL is set)
        run: python tools/set_version.py ${{ needs.prepare.outputs.version }} --telemetry "${{ vars.TELEMETRY_URL }}"
      - name: install the engine and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install ".[heic,export,watch,cutout]" "pyinstaller>=6.10"
      # ffmpeg: static builds for Linux and Windows (FFmpeg-Builds, GPL: libx264 is the software encoder TripShots
      # falls back to; shipped as separate programs with their licence, source at https://ffmpeg.org). The newest
      # stable release build is looked up, so a new ffmpeg version or a renamed file doesn't break the release.
      # On macOS the engine uses Homebrew's ffmpeg; the app says how to install it when it's missing.
      - name: ffmpeg (Linux, Windows)
        if: runner.os != 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OSNAME: ${{ runner.os == 'Windows' && 'win64' || 'linux64' }}
        run: |
          set -euo pipefail
          url=$(gh api repos/FFmpeg-Builds/FFmpeg-Builds/releases/tags/latest --jq '.assets[].browser_download_url' \
            | grep -E "/ffmpeg-n[0-9.]+-latest-${OSNAME}-gpl-[0-9.]+\.(tar\.xz|zip)$" | sort -V | tail -1)
          [ -n "$url" ] || { echo "::error::no stable ${OSNAME} GPL build found in FFmpeg-Builds"; exit 1; }
          echo "ffmpeg: $url"
          curl -fsSL -o "ff.${url##*.}" "$url"
          mkdir ffmpeg ffbin
          if [ "$OSNAME" = win64 ]; then unzip -q ff.zip -d ffmpeg; else tar -xf ff.xz -C ffmpeg; fi
          cp ffmpeg/*/bin/ffmpeg* ffmpeg/*/bin/ffprobe* ffbin/
          cp ffmpeg/*/LICENSE.txt ffbin/
          ls -la ffbin
      # libfribidi: Pillow opens it at run time to join complex scripts (Malayalam, Hindi, Arabic); its wheels don't
      # include it on any system, so the spec bundles the build machine's copy (LGPL, loaded as a library).
      # Windows: MSYS2's build (MSYS2 is preinstalled on GitHub's Windows runners)
      - name: fribidi
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS) brew install fribidi ;;
            Linux) sudo apt-get update -qq && sudo apt-get install -y -qq libfribidi0 ;;
            Windows) /c/msys64/usr/bin/pacman.exe -S --noconfirm --needed mingw-w64-x86_64-fribidi
                     ls -la /c/msys64/mingw64/bin/libfribidi-0.dll ;;
          esac
      - name: freeze
        run: pyinstaller packaging/engine/tripshots.spec --noconfirm --clean
      - name: package and smoke-test
        shell: bash
        run: |
          FF=""; [ -d ffbin ] && FF="--ffmpeg ffbin"
          python packaging/engine/package.py --dist dist/tripshots --platform ${{ matrix.platform }} \
            --version ${{ needs.prepare.outputs.version }} $FF --out out
      - name: sign
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in out/tripshots-engine-*.tar.gz out/tripshots-engine-*.zip; do
            [ -f "$f" ] && npx --yes @tauri-apps/cli@2 signer sign "$f"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.platform }}
          path: out/*
          retention-days: 7

  engine-manifest:
    needs: [prepare, engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          path: artifacts
      - name: engine.json
        run: python packaging/engine/manifest.py --version ${{ needs.prepare.outputs.version }} --repo ${{ github.repository }} --dir artifacts
      - name: upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" engine.json artifacts/*/tripshots-engine-*.tar.gz artifacts/*/tripshots-engine-*.zip \
            artifacts/*/tripshots-engine-*.sig --clobber

  app:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, args: "--target aarch64-apple-darwin", rust: aarch64-apple-darwin }
          - { os: ubuntu-22.04, args: "", rust: "" }
          - { os: windows-latest, args: "", rust: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: stamp the version
        shell: bash
        run: $(command -v python3 || command -v python) tools/set_version.py ${{ needs.prepare.outputs.version }}
      - run: npm ci
        working-directory: desktop
      # Apple signing only when its secrets are set: an unset secret still arrives as an empty variable, and the
      # bundler then tries to import an empty certificate. Without them the .dmg is built unsigned.
      - name: Apple signing (when configured)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::no APPLE_CERTIFICATE secret: the macOS app is built unsigned"
            exit 0
          fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              d="EOF_$RANDOM$RANDOM"
              { echo "$v<<$d"; echo "${!v}"; echo "$d"; } >> "$GITHUB_ENV"
            fi
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish:
    needs: [prepare, engine-manifest, app]
    runs-on: ubuntu-latest
    steps:
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --repo ${{ github.repository }}
